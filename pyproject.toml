[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palletlab"
version = "0.1.0"
description = "Mixed-case palletizing and robot task optimization: heuristics, metaheuristics, CP-SAT, MCTS, MuJoCo validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "ortools>=9.10", "mujoco>=3.1", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["palletlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
